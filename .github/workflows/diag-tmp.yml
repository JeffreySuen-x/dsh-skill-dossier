name: CI diagnostic (temporary)

# 临时诊断：本地 macOS 复现不出 CI 的失败（干净克隆四闸全过），而 Actions 日志
# 需要鉴权读不到。本作业在每次 push 后把 `node qa/gates.mjs` 的原始输出打成
# artifact（公开仓库可匿名下载），看完即撤。
on: push

permissions:
  contents: read

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - name: Collect gate output
        run: |
          node -v > diag.txt 2>&1
          node -e "console.log('platform', process.platform, process.arch)" >> diag.txt 2>&1
          echo "which pnpm: $(command -v pnpm || echo MISSING)" >> diag.txt 2>&1
          node qa/gates.mjs >> diag.txt 2>&1
          echo "gates-exit=$?" >> diag.txt
          git status --porcelain >> diag.txt 2>&1
      - uses: actions/upload-artifact@v5
        with:
          name: diag-${{ matrix.os }}-node${{ matrix.node }}
          path: diag.txt
          if-no-files-found: error
