name: CI diagnostic win (temporary)

on: push

permissions:
  contents: write

jobs:
  diagwin:
    if: ${{ !contains(github.event.head_commit.message, '[ci-diag]') }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Collect gate output
        run: |
          node -v > diagwin.txt 2>&1
          $env:DSH_REAL_ROOTS='0'
          node qa/gates.mjs >> diagwin.txt 2>&1
          echo "gates-exit=$LASTEXITCODE" >> diagwin.txt
          git status --porcelain >> diagwin.txt 2>&1
      - name: Publish diagnostic to ci-diag branch
        continue-on-error: true
        run: |
          git config user.name "ci-diagnostic"
          git config user.email "ci-diagnostic@users.noreply.github.com"
          git checkout -b ci-diag
          git add -f diagwin.txt
          git commit -m "chore: [ci-diag] windows gate output round 2"
          git push --force origin ci-diag
