name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - run: node qa/gates.mjs
        env:
          # runner 上没有真实技能根，这条自检在干净机器上无意义
          # （见 tests/real-roots.spec.ts 头部说明）。
          DSH_REAL_ROOTS: '0'
      - name: Verify committed build artifacts
        # `git diff` 只看已跟踪文件：构建新生成、但没提交的 `lib/` 文件它看不见，
        # 于是「产物集缺失/多出」能蒙过去。这里连未跟踪文件一起查。
        run: |
          output="$(git status --porcelain --untracked-files=all -- lib)"
          if [ -n "$output" ]; then
            echo "lib/ 与提交物不一致："
            echo "$output"
            exit 1
          fi
          echo "lib/ 与提交物一致"
