name: CI diagnostic (temporary)

# 临时诊断：本地 macOS 复现不出 CI 的失败（干净克隆四闸全过），而 Actions 日志
# 需要鉴权读不到。本作业在每次 push 后把 `node qa/gates.mjs` 的原始输出打成
# artifact（公开仓库可匿名下载），看完即撤。
on: push

permissions:
  contents: write

jobs:
  diag:
    if: ${{ !contains(github.event.head_commit.message, '[ci-diag]') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - name: Collect gate output
        run: |
          node -v > diag.txt 2>&1
          node -e "console.log('platform', process.platform, process.arch)" >> diag.txt 2>&1
          echo "which pnpm: $(command -v pnpm || echo MISSING)" >> diag.txt 2>&1
          node qa/gates.mjs >> diag.txt 2>&1 || echo "gates-exit=$?" >> diag.txt
          git status --porcelain >> diag.txt 2>&1
      - name: Publish diagnostic to ci-diag branch
        run: |
          git config user.name "ci-diagnostic"
          git config user.email "ci-diagnostic@users.noreply.github.com"
          git checkout -b ci-diag
          git add -f diag.txt
          git commit -m "chore: [ci-diag] ${{ matrix.os }} node ${{ matrix.node }} gate output"
          git push --force origin ci-diag
        continue-on-error: true
